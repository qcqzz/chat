name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装 Android SDK
        run: |
          # 下载 Android 命令行工具
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          
          # 设置环境变量
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          
          # 接受许可协议并安装 SDK
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1

      - name: 安装 npm 依赖
        run: npm ci

      - name: 同步 Capacitor（含插件注册）
        run: |
          # 如果 android 平台已存在则跳过 add，直接 sync
          if [ -d android ]; then
            echo "Android 平台已存在，跳过 cap add"
          else
            ./node_modules/.bin/cap add android
          fi
          ./node_modules/.bin/cap sync

      - name: 设置版本号
        run: |
          # 更新 versionCode 和 versionName（覆盖 Capacitor 默认值）
          sed -i 's/versionCode 1/versionCode 12/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.5.1"/' android/app/build.gradle
          echo "Updated versionCode to 12, versionName to 1.5.1"

      - name: 注入前台服务保活代码
        run: |
          # 复制自定义 Android 源文件到 Capacitor 项目
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/chuanxun/app/
          mkdir -p android/app/src/main/res/xml/
          
          # file_paths.xml — FileProvider 路径配置（AndroidManifest 引用 @xml/file_paths）
          cp android-src/app/src/main/res/xml/file_paths.xml \
             android/app/src/main/res/xml/
          
          # ForegroundService.java — 前台服务保活
          cp android-src/app/src/main/java/com/chuanxun/app/ForegroundService.java \
             android/app/src/main/java/com/chuanxun/app/
          
          # ForegroundPlugin.java — Capacitor 插件
          cp android-src/app/src/main/java/com/chuanxun/app/ForegroundPlugin.java \
             android/app/src/main/java/com/chuanxun/app/
          
          # NotificationPlugin.java — 自定义通知插件
          cp android-src/app/src/main/java/com/chuanxun/app/NotificationPlugin.java \
             android/app/src/main/java/com/chuanxun/app/
          
          # KeepAliveReceiver.java — 定时唤醒接收器
          cp android-src/app/src/main/java/com/chuanxun/app/KeepAliveReceiver.java \
             android/app/src/main/java/com/chuanxun/app/
          
          # BootReceiver.java — 开机自启动接收器
          cp android-src/app/src/main/java/com/chuanxun/app/BootReceiver.java \
             android/app/src/main/java/com/chuanxun/app/
          
          # MainActivity.java — 启动前台服务
          cp android-src/app/src/main/java/com/chuanxun/app/MainActivity.java \
             android/app/src/main/java/com/chuanxun/app/
          
          # AndroidManifest.xml — 注册服务 + 权限
          cp android-src/app/src/main/AndroidManifest.xml \
             android/app/src/main/
          
          # capacitor.plugins.json — 注册插件
          cp android-src/app/src/main/assets/capacitor.plugins.json \
             android/app/src/main/assets/
          
          echo "前台服务代码已注入"

      - name: 替换应用图标
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp resources/mipmap-$density/ic_launcher.png android/app/src/main/res/mipmap-$density/
            cp resources/mipmap-$density/ic_launcher_round.png android/app/src/main/res/mipmap-$density/
            cp resources/mipmap-$density/ic_launcher_foreground.png android/app/src/main/res/mipmap-$density/
          done
          echo "Icons replaced"
          
          # 创建通知图标（Android 通知必需）
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/drawable-$density
            cp resources/mipmap-$density/ic_launcher.png android/app/src/main/res/drawable-$density/ic_stat_notification.png
          done
          mkdir -p android/app/src/main/res/drawable
          cp resources/mipmap-hdpi/ic_launcher.png android/app/src/main/res/drawable/ic_stat_notification.png
          echo "Notification icons created"

      - name: 构建 APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 签名 APK (v1+v2+v3)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          rm release.keystore

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk